<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#0b5d3b">
<title>Saudi Job Match AI</title>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#f4f6f8;
  color:#222;
}

header{
  background:#0b5d3b;
  color:white;
  padding:28px 18px;
  text-align:center;
}

header h1{
  margin:0;
  font-size:28px;
}

header p{
  margin:8px 0 0;
}

.container{
  max-width:760px;
  margin:auto;
  padding:18px;
}

.card{
  background:white;
  border-radius:15px;
  padding:20px;
  margin-bottom:18px;
  box-shadow:0 2px 12px rgba(0,0,0,.08);
}

h2{
  margin-top:0;
}

label{
  display:block;
  margin-top:14px;
  font-weight:bold;
}

input,select,textarea,button{
  width:100%;
  padding:13px;
  margin-top:7px;
  border-radius:9px;
  border:1px solid #ccc;
  font-size:16px;
}

textarea{
  min-height:110px;
  resize:vertical;
}

button{
  background:#0b5d3b;
  color:white;
  border:none;
  font-weight:bold;
  cursor:pointer;
  margin-top:18px;
}

button:hover{
  background:#08482e;
}

.job{
  border:1px solid #ddd;
  border-radius:12px;
  padding:16px;
  margin-top:14px;
}

.job h3{
  margin:0 0 8px;
}

.match{
  font-size:20px;
  font-weight:bold;
  color:#0b5d3b;
}

.reason{
  background:#f1f8f4;
  padding:10px;
  border-radius:8px;
  margin-top:8px;
}

.apply{
  display:block;
  text-align:center;
  text-decoration:none;
  background:#0b5d3b;
  color:white;
  padding:12px;
  border-radius:8px;
  margin-top:12px;
  font-weight:bold;
}

.empty{
  color:#666;
  text-align:center;
}

.badge{
  display:inline-block;
  background:#e8f4ee;
  color:#0b5d3b;
  padding:5px 9px;
  border-radius:20px;
  margin:3px;
  font-size:13px;
}
</style>
</head>

<body>

<header>
  <h1>🇸🇦 Saudi Job Match AI</h1>
  <p>Find Saudi jobs matching your experience</p>
</header>

<div class="container">

<div class="card">

<h2>👤 Your Job Profile</h2>

<label>Name</label>
<input id="name" placeholder="Your name">

<label>Your experience</label>
<textarea id="experience"
placeholder="Example: Restaurant Manager, Kudu Saudi Arabia, McDonald's India, retail supervision, team management, inventory, P&L, soft services"></textarea>

<label>Preferred city</label>
<select id="city">
<option value="">Any Saudi city</option>
<option>Jeddah</option>
<option>Riyadh</option>
<option>Dammam</option>
<option>Khobar</option>
<option>Mecca</option>
<option>Medina</option>
<option>Jubail</option>
<option>Any Saudi City</option>
</select>

<label>Minimum salary (SAR)</label>
<input id="salary" type="number" placeholder="Example: 5000">

<label>Preferred job</label>
<select id="category">
<option value="">Any matching job</option>
<option>Restaurant Manager</option>
<option>Store Manager</option>
<option>Retail Supervisor</option>
<option>Soft Services Supervisor</option>
<option>Store Keeper</option>
<option>F&B Supervisor</option>
<option>Branch Manager</option>
<option>Area Supervisor</option>
</select>

<button onclick="findJobs()">🔎 Find Matching Jobs</button>

</div>

<div class="card">

<h2>🎯 Matching Jobs</h2>

<div id="results" class="empty">
Enter your profile and tap
<b>Find Matching Jobs</b>.
</div>

</div>

</div>

<script>

const jobs = [

{
title:"Restaurant Manager",
city:"Jeddah",
salary:6500,
keywords:["restaurant","manager","qsr","food","f&b","team","operations"],
link:"https://www.linkedin.com/jobs/"
},

{
title:"Store Manager",
city:"Jeddah",
salary:6000,
keywords:["store","manager","retail","inventory","team","operations"],
link:"https://www.linkedin.com/jobs/"
},

{
title:"Retail Supervisor",
city:"Jeddah",
salary:5500,
keywords:["retail","supervisor","store","inventory","team","sales"],
link:"https://www.linkedin.com/jobs/"
},

{
title:"Soft Services Supervisor",
city:"Jeddah",
salary:5000,
keywords:["soft","service","supervisor","cleaning","facility","fm","bicSc","hse"],
link:"https://www.linkedin.com/jobs/"
},

{
title:"Store Keeper",
city:"Jeddah",
salary:4500,
keywords:["store","storekeeper","inventory","warehouse","erp","stock"],
link:"https://www.linkedin.com/jobs/"
},

{
title:"F&B Supervisor",
city:"Riyadh",
salary:5500,
keywords:["restaurant","f&b","food","beverage","supervisor","hotel"],
link:"https://www.linkedin.com/jobs/"
},

{
title:"Branch Manager",
city:"Riyadh",
salary:7000,
keywords:["branch","manager","retail","restaurant","operations","team","p&l"],
link:"https://www.linkedin.com/jobs/"
},

{
title:"Area Supervisor",
city:"Dammam",
salary:6500,
keywords:["area","supervisor","operations","restaurant","retail","team"],
link:"https://www.linkedin.com/jobs/"
}

];


function findJobs(){

const experience =
document.getElementById("experience").value.toLowerCase();

const city =
document.getElementById("city").value;

const salary =
Number(document.getElementById("salary").value || 0);

const category =
document.getElementById("category").value.toLowerCase();


const scored = jobs.map(job => {

let score = 0;
let matched = [];

const text =
experience + " " + category;


job.keywords.forEach(keyword => {

if(text.includes(keyword.toLowerCase())){

score += 10;

matched.push(keyword);

}

});


if(category &&
job.title.toLowerCase().includes(category)){

score += 25;

}


if(city &&
(job.city === city || city === "Any Saudi City")){

score += 20;

}


if(salary > 0 && job.salary >= salary){

score += 15;

}


score = Math.min(score,100);


return {
job,
score,
matched
};

});


const filtered = scored
.filter(item => {

if(city &&
city !== "Any Saudi City" &&
item.job.city !== city){

return false;

}

if(salary &&
item.job.salary < salary){

return false;

}

if(category &&
!item.job.title.toLowerCase().includes(category) &&
item.score < 35){

return false;

}

return item.score > 0;

})
.sort((a,b)=>b.score-a.score);


const results =
document.getElementById("results");


if(filtered.length === 0){

results.innerHTML =
"<p class='empty'>No matching jobs found. Try changing your city, salary or job category.</p>";

return;

}


results.innerHTML = filtered.map(item => {

const j = item.job;

const reasons =
item.matched.length
? item.matched.slice(0,6).map(x =>
`<span class="badge">${x}</span>`
).join("")
: "<span class='badge'>Profile match</span>";


return `

<div class="job">

<h3>${j.title}</h3>

<p>📍 <b>${j.city}</b></p>

<p>💰 Salary: <b>SAR ${j.salary.toLocaleString()}+</b></p>

<p class="match">
🎯 ${item.score}% Match
</p>

<div class="reason">
<b>Why this matches:</b><br>
${reasons}
</div>

<a class="apply"
href="${j.link}"
target="_blank">
Apply / Search Job
</a>

</div>

`;

}).join("");

}

</script>

</body>
</html>
